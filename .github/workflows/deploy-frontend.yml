name: 🚀 Deploy SkyIntel AI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build Frontend for GitHub Pages
        working-directory: frontend
        env:
          # Base path must match your repo name for GitHub Pages
          VITE_BASE: /SkyIntel-Ai/
          # Point to your Render.com backend URL
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: 📄 Create 404.html for SPA routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🚀 Deploy SkyIntel AI - ${{ github.sha }}'
