[project]
name = "skyintel-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "pydantic-settings==2.9.1",
    "email-validator==2.2.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "httpx==0.28.1",
    "scikit-learn==1.6.1",
    "numpy==2.2.5",
    "joblib==1.5.0",
    "reportlab>=4.0.0",
    "requests==2.34.2",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
]

[tool.vercel]
entrypoint = "backend.main:app"
