services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/rain_predictor.db
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
    volumes:
      - rain_data:/app/data
      - rain_models:/app/backend/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  rain_data:
  rain_models:
